---
# PHASE D caller: a realistic matrix (3 Python versions × 2 tox envs = 6
# legs) -- the caller owns 100% of this orchestration decision; the
# reusable workflow's code hasn't changed to support more legs, because it
# never needed to know how many there'd be.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        toxenv:
        - py
        - pre-commit
        - needs-jq
        xfail:
        - false
    uses: ./.github/workflows/reusable-tox.yml
    with:
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ubuntu-latest
      toxenv: ${{ matrix.toxenv }}
      timeout-minutes: '5'
      xfail: ${{ matrix.xfail }}
      tox-run-posargs: --cov-report=xml --junitxml=test-results.xml
      tox-rerun-posargs: --no-cov --lf -vvvvv
