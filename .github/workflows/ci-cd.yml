---
# PHASE C caller: adds a second toxenv (`needs-jq`) so the hook's
# `toxenv`-gated branch is exercised for real, side by side with the
# ordinary `py` leg where the hook still runs but does nothing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        toxenv:
        - py
        - needs-jq
        xfail:
        - false
    uses: ./.github/workflows/reusable-tox.yml
    with:
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ubuntu-latest
      toxenv: ${{ matrix.toxenv }}
      timeout-minutes: '5'
      xfail: ${{ matrix.xfail }}
      tox-run-posargs: --cov-report=xml --junitxml=test-results.xml
      tox-rerun-posargs: --no-cov --lf -vvvvv
