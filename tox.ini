[tox]
envlist = py
isolated_build = true

[testenv]
package = wheel
deps =
    pytest
    pytest-cov
# NOTE: tox does NOT forward arbitrary host env vars into the testenv by
# default -- without this line, GITHUB_ACTIONS/GITHUB_OUTPUT below are
# invisible inside the subprocess and commands_post silently no-ops. This
# is the exact real-world reason the full reusable-tox.yml sets
# `TOX_TESTENV_PASSENV` (see VERIFIED-SOURCE.md §... the color-env block) --
# good live proof of Pattern 5 ("explicit over implicit has a cost").
passenv =
    GITHUB_ACTIONS
    GITHUB_OUTPUT
commands =
    pytest {tty:--color=yes} {posargs:--cov-report=html:{envtmpdir}/htmlcov/} \
        --cov=ci_patterns_demo --cov-report=term-missing
# --- the "aha moment" contract, simplified for teaching -------------------
# This block is deliberately a stripped-down version of the real
# `awx-plugins` `tox.ini` convention documented in VERIFIED-SOURCE.md §5 --
# read this one line-by-line before ever showing the real thing.
#
# It does nothing outside CI (`GITHUB_ACTIONS` is only set to "true" by
# GitHub Actions itself), so a contributor running `tox` on a laptop never
# sees this code path at all -- that's the whole point of the pattern.
commands_post =
    python -c 'import os, sys; \
        os.getenv("GITHUB_ACTIONS") == "true" or sys.exit(0); \
        gh_out = os.environ["GITHUB_OUTPUT"]; \
        open(gh_out, "a").write("test-result-files=\n")'

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
